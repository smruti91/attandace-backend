[package]
name = "face-service-rust"
version = "0.1.0"
edition = "2021"
description = "Rust/ONNX-Runtime port of the InsightFace face-service (SCRFD detect + wbob recognition), exposing the same HTTP JSON contract as face-service/app.py."
license = "ISC"

[[bin]]
name = "face-service-rust"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
futures-util = "0.3"

# ONNX Runtime bindings. All ort API surface is confined to src/ortutil.rs so
# version drift only touches one module.
ort = { version = "2.0.0-rc.14", default-features = true }
ndarray = "0.16"

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
